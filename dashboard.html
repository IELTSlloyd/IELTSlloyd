<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS with Lloyd — Dashboard</title>
<style>
  :root {
    --bg: #0f141b;
    --panel: #151c25;
    --line: #263140;
    --ink: #eef2f6;
    --ink-dim: #8fa0b0;
    --teal: #4fb3a9;
    --amber: #e0a640;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Cambria', serif;
    min-height: 100vh;
  }

  /* auth gate: hidden until confirmed logged in */
  #app { display: none; }

  .checking {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    color: var(--ink-dim);
    font-family: Arial, sans-serif;
  }

  header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 0 32px;
    display: flex;
    align-items: center;
    height: 100px;
  }

  .logo { height: 74px; width: auto; flex-shrink: 0; }

  .tabs {
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    flex: 1;
    height: 100%;
    margin-left: 32px;
  }

  .band-btn {
    height: 42px;
    width: auto;
    cursor: pointer;
    filter: brightness(0.85) saturate(0.85);
    transition: filter 0.15s ease, transform 0.15s ease;
    border-radius: 999px;
  }

  .band-btn:hover,
  .band-btn.current {
    filter: brightness(1) saturate(1);
    transform: translateY(-1px);
  }

  .band-btn.current {
    box-shadow: 0 0 0 2px var(--amber);
  }

  .logout-btn {
    all: unset;
    color: var(--ink-dim);
    font-family: Arial, sans-serif;
    font-size: 13px;
    cursor: pointer;
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    margin-left: 24px;
    white-space: nowrap;
  }

  .logout-btn:hover { color: var(--ink); border-color: var(--teal); }

  main {
    padding: 40px;
    max-width: 1000px;
    margin: 0 auto;
  }

  .lesson-list {
    display: none;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 32px;
  }

  .lesson-list.visible { display: flex; }

  .lesson-list button {
    all: unset;
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 12px 20px;
    font-family: Arial, sans-serif;
    font-size: 14px;
    color: var(--ink-dim);
    cursor: pointer;
    border-radius: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .lesson-list button:hover {
    color: var(--ink);
    border-color: var(--teal);
  }

  .lesson-list button.active {
    color: var(--amber);
    border-color: var(--amber);
  }

  .lesson-list button .num {
    font-size: 11px;
    color: var(--teal);
  }

  .content-frame {
    border: 1px solid var(--line);
    background: var(--panel);
    min-height: 400px;
    padding: 50px 40px;
    text-align: center;
  }

  .content-frame .tag {
    display: inline-block;
    margin-bottom: 18px;
    font-size: 13px;
    color: var(--amber);
    border: 1px solid var(--amber);
    padding: 4px 12px;
    font-family: Arial, sans-serif;
  }

  .content-frame h1 { font-size: 28px; margin: 0 0 14px; }

  .content-frame p {
    color: var(--ink-dim);
    font-size: 15px;
    line-height: 1.6;
    max-width: 520px;
    margin: 0 auto;
    font-family: Arial, sans-serif;
  }
</style>
</head>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // ---- REPLACE THIS WITH YOUR OWN FIREBASE CONFIG (same as index.html) ----
  const firebaseConfig = {
    apiKey: "AIzaSyB140O296lRc1WLrqL404sf4P1M1DGHeEs",
    authDomain: "ielts-with-lloyd.firebaseapp.com",
    projectId: "ielts-with-lloyd",
    storageBucket: "ielts-with-lloyd.firebasestorage.app",
    messagingSenderId: "136226512650",
    appId: "1:136226512650:web:c2c8f159769ec2cc44a4f3"
  };
  // ---------------------------------------------------------------------

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      // not logged in — bounce back to login page
      window.location.href = "index.html";
    } else {
      document.getElementById("checking").style.display = "none";
      document.getElementById("app").style.display = "block";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => {
    signOut(auth).then(() => {
      window.location.href = "index.html";
    });
  });

  // ---- Tab + lesson interaction (same pattern as the earlier sample) ----
  const titles = {
    "5.0-1": "Travel & Transportation",
    "5.0-2": "Infrastructure",
    "5.0-3": "Holidays & Leisure",
    "6.0-1": "Business",
    "6.0-2": "Advertising",
    "6.0-3": "Natural Resources",
    "6.0-4": "Festivals",
    "6.5-1": "Science & Technology",
    "6.5-2": "Urban & Rural Life",
    "6.5-3": "Leadership & Management",
    "6.5-4": "Art & Architecture",
    "7.0-1": "Historical Places & Events",
    "7.0-2": "Censorship & Free Expression",
    "7.0-3": "Sustainable Development"
  };

  document.querySelectorAll(".band-btn").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".band-btn").forEach((b) => b.classList.remove("current"));
      btn.classList.add("current");

      const band = btn.dataset.band;
      document.querySelectorAll(".lesson-list").forEach((list) => {
        list.classList.toggle("visible", list.dataset.bandList === band);
      });
    });
  });

  document.querySelectorAll(".lesson-list button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".lesson-list button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");

      const band = btn.dataset.band;
      const num = btn.dataset.lesson;
      const title = titles[`${band}-${num}`];

      document.getElementById("content").innerHTML = `
        <div class="tag">BAND ${band} · LESSON ${num.padStart(2, "0")}</div>
        <h1>${title}</h1>
        <p>This is where that lesson's actual HTML file will load.</p>
      `;
    });
  });
</script>
