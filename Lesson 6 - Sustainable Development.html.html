<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS 7.0 Speaking · Sustainable Development</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10160F;
    --panel:#1A2318;
    --panel-2:#222D1F;
    --paper:#F1F3EE;
    --paper-dim:#DEE3D6;
    --coral:#3E8A5E;
    --coral-dim:#2F6B48;
    --mint:#D98E3D;
    --gold:#D98E3D;
    --third:#5B8FA8;
    --fourth:#A3A047;
    --fifth:#8A7CA8;
    --line:rgba(241,243,238,0.12);
    --text-dim:rgba(241,243,238,0.62);
    --text-faint:rgba(241,243,238,0.38);
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  ::selection{background:var(--coral);color:var(--paper);}
  a{color:inherit;}
  button{font-family:inherit;}
  .app{display:grid;grid-template-columns:340px 1fr;min-height:100vh;}

  /* RAIL */
  .rail{background:var(--panel);border-right:1px solid var(--line);padding:24px 18px 18px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 14px;border-bottom:1px solid var(--line);}
  .brand .tag{font-family:'JetBrains Mono',monospace;font-size:14.5px;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;font-weight:700;}
  .brand h1{font-family:'Fraunces',serif;font-size:25px;font-weight:700;margin:4px 0 0;line-height:1.15;}
  .brand .sub{font-size:16px;color:var(--text-dim);margin-top:4px;}
  .onair{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
  .onair .dot{width:8px;height:8px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 0 rgba(62,138,94,.6);animation:pulse 1.8s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(62,138,94,.55);}70%{box-shadow:0 0 0 6px rgba(62,138,94,0);}100%{box-shadow:0 0 0 0 rgba(62,138,94,0);}}
  .onair .label{font-family:'JetBrains Mono',monospace;font-size:14.5px;letter-spacing:.1em;color:var(--text-dim);text-transform:uppercase;}
  .onair .score{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20.5px;color:var(--gold);}
  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:17.5px;color:var(--text-dim);border:1px solid transparent;transition:background .15s,color .15s;user-select:none;}
  .nav-item .n{font-family:'JetBrains Mono',monospace;font-size:15px;width:20px;color:var(--text-faint);flex-shrink:0;}
  .nav-item:hover{background:rgba(241,243,238,0.05);color:var(--paper);}
  .nav-item.active{background:rgba(62,138,94,0.18);border-color:rgba(62,138,94,0.4);color:var(--paper);}
  .nav-item.active .n{color:var(--coral);}
  .nav-item .done-mark{margin-left:auto;color:var(--gold);font-size:17.5px;opacity:0;}
  .nav-item.done .done-mark{opacity:1;}
  .rail-foot{font-size:15px;color:var(--text-faint);border-top:1px solid var(--line);padding-top:12px;line-height:1.5;}

  /* MAIN */
  main{padding:48px 64px 100px;max-width:1180px;width:100%;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);font-weight:700;margin-bottom:10px;}
  h2.title{font-family:'Fraunces',serif;font-size:50px;font-weight:700;line-height:1.05;margin:0 0 10px;}
  .deck{font-size:22px;color:var(--text-dim);margin:0 0 36px;max-width:700px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;}

  /* TIMER */
  .timer-wrap{display:flex;align-items:center;gap:22px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:28px;}
  .ring{position:relative;width:92px;height:92px;flex-shrink:0;}
  .ring svg{transform:rotate(-90deg);}
  .ring circle{fill:none;stroke-width:6;}
  .ring .bg{stroke:var(--line);}
  .ring .fg{stroke:var(--coral);stroke-linecap:round;transition:stroke-dashoffset .25s linear;}
  .ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;}
  .timer-meta{flex:1;}
  .timer-meta .t-label{font-size:19px;color:var(--text-dim);margin-bottom:4px;}
  .timer-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{font-family:'Inter',sans-serif;font-size:18px;font-weight:600;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--paper);cursor:pointer;transition:background .15s,border-color .15s,transform .1s;}
  .btn:hover{background:rgba(241,243,238,0.08);}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--coral);border-color:var(--coral);color:var(--paper);}
  .btn.primary:hover{background:#4CA271;}
  .btn.ghost{background:transparent;}

  /* PROMPTS */
  .prompt-current{display:flex;gap:16px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px;}
  .prompt-current .pn{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:19px;color:var(--coral);flex-shrink:0;padding-top:1px;}
  .prompt-current p{margin:0;font-size:24px;line-height:1.5;}

  /* FLIP CARDS */
  .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .flip{perspective:1000px;height:220px;cursor:pointer;}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .flip.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;justify-content:center;}
  .flip-front{background:var(--panel);}
  .flip-front .def-prompt{font-family:'Inter',sans-serif;font-weight:600;font-size:18.5px;line-height:1.35;}
  .flip-front .hint{font-size:16px;color:var(--text-faint);margin-top:10px;}
  .flip-back{background:var(--coral);color:var(--paper);transform:rotateY(180deg);}
  .flip-back .word-reveal{font-family:'Fraunces',serif;font-weight:700;font-style:italic;font-size:23px;margin-bottom:8px;}
  .flip-back .ex{font-size:16px;font-style:italic;line-height:1.4;opacity:.9;}

  /* MATCHING */
  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:30px;}
  .match-col h4{font-family:'JetBrains Mono',monospace;font-size:16px;letter-spacing:.1em;color:var(--text-faint);text-transform:uppercase;margin:0 0 12px;}
  .match-item,.match-item2{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;font-size:18.5px;transition:border-color .15s,background .15s;}
  .match-item .tag,.match-item2 .tag{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--text-faint);width:18px;flex-shrink:0;}
  .match-item.selected,.match-item2.selected{border-color:var(--gold);background:rgba(217,142,61,0.16);}
  .match-item.correct,.match-item2.correct{border-color:var(--coral);background:rgba(62,138,94,0.16);}
  .match-item.wrong,.match-item2.wrong{border-color:#E67E5B;background:rgba(230,126,91,0.12);}
  .match-item.locked,.match-item2.locked{cursor:default;opacity:.85;}

  /* IDIOMS */
  .idiom-list{display:flex;flex-direction:column;gap:10px;}
  .idiom{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s;}
  .idiom:hover{border-color:rgba(62,138,94,.4);}
  .idiom-head{display:flex;align-items:center;justify-content:space-between;}
  .idiom-head .phrase{font-family:'Fraunces',serif;font-weight:600;font-size:22px;}
  .idiom-head .chev{color:var(--text-faint);transition:transform .2s;font-size:19px;}
  .idiom.open .chev{transform:rotate(90deg);}
  .idiom-body{max-height:0;overflow:hidden;transition:max-height .3s ease;}
  .idiom.open .idiom-body{max-height:110px;}
  .idiom-mean{font-size:19px;color:var(--text-dim);margin-top:8px;}
  .idiom-ex{font-size:17px;font-style:italic;color:var(--text-faint);margin-top:4px;padding-bottom:4px;}

  /* GAP FILL */
  .gapfill-list{display:flex;flex-direction:column;gap:16px;}
  .gap-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .gap-item p{margin:0 0 10px;font-size:20px;line-height:1.6;}
  .gap-blank{font-family:'JetBrains Mono',monospace;display:inline-block;min-width:230px;text-align:center;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--gold);padding:6px 12px;font-weight:700;cursor:pointer;}
  .gap-blank.selected{border-color:var(--gold);box-shadow:0 0 0 2px rgba(217,142,61,.3);}
  .gap-blank.filled{color:var(--coral);border-color:var(--coral);}
  .wordbank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
  .wb-chip{font-family:'JetBrains Mono',monospace;font-size:16.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:8px 15px;color:var(--text-dim);cursor:pointer;transition:border-color .15s,color .15s,opacity .15s;}
  .wb-chip:hover{border-color:var(--coral);color:var(--paper);}
  .wb-chip.used{opacity:.3;pointer-events:none;text-decoration:line-through;}
  .quiz-feedback{font-size:19px;color:var(--text-dim);min-height:18px;}
  .quiz-feedback.good{color:var(--coral);}
  .quiz-feedback.bad{color:#E67E5B;}

  /* QUIZ */
  .quiz-progress{display:flex;gap:6px;margin-bottom:24px;}
  .quiz-dot{flex:1;height:4px;border-radius:3px;background:var(--line);}
  .quiz-dot.active{background:var(--coral);}
  .quiz-dot.answered{background:var(--gold);}
  .quiz-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
  .quiz-q{font-size:25px;font-weight:600;margin:0 0 20px;line-height:1.4;}
  .quiz-opts{display:flex;flex-direction:column;gap:10px;}
  .quiz-opt{display:flex;gap:12px;align-items:center;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:13px 16px;cursor:pointer;font-size:19.5px;transition:border-color .15s,background .15s;}
  .quiz-opt:hover{border-color:rgba(62,138,94,.45);}
  .quiz-opt .letter{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;width:32px;height:32px;border-radius:50%;background:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-dim);}
  .quiz-opt.correct{border-color:var(--coral);background:rgba(62,138,94,0.18);}
  .quiz-opt.correct .letter{background:var(--coral);color:var(--paper);}
  .quiz-opt.wrong{border-color:#E67E5B;background:rgba(230,126,91,0.14);animation:shake .3s;}
  .quiz-opt.locked{cursor:default;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-5px);}75%{transform:translateX(5px);}}
  .quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .roundtab{display:flex;gap:8px;margin-bottom:22px;}
  .roundtab button{font-family:'JetBrains Mono',monospace;font-size:16px;padding:7px 13px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--text-dim);cursor:pointer;}
  .roundtab button.on{background:var(--coral);color:var(--paper);border-color:var(--coral);}

  /* WARM-UP TABS */
  .warmup-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
  .warmup-tab{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text-dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s,color .15s;}
  .warmup-tab:hover{border-color:rgba(62,138,94,.45);color:var(--paper);}
  .warmup-tab.on{border-color:var(--coral);background:rgba(62,138,94,.2);color:var(--paper);}

  /* SORTERS */
  .sort-intro{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px;}
  .sort-intro-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .sort-intro-item .k{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:15.5px;margin-bottom:6px;display:block;}
  .sort-intro-item[data-k="A"] .k{color:var(--gold);}
  .sort-intro-item[data-k="B"] .k{color:var(--coral);}
  .sort-intro-item[data-k="C"] .k{color:var(--third);}
  .sort-intro-item[data-k="O1"] .k{color:var(--coral);}
  .sort-intro-item[data-k="R"] .k{color:var(--gold);}
  .sort-intro-item[data-k="E"] .k{color:var(--third);}
  .sort-intro-item[data-k="O2"] .k{color:var(--fourth);}
  .sort-intro-item[data-k="P"] .k{color:var(--fifth);}
  .sort-intro-item p{margin:0;font-size:15.5px;color:var(--text-dim);line-height:1.4;}
  .focus-list{display:flex;flex-direction:column;gap:14px;}
  .focus-item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .focus-item p{margin:0 0 14px;font-size:20.5px;line-height:1.5;}
  .focus-btns{display:flex;gap:10px;flex-wrap:wrap;}
  .focus-btn{font-family:'Inter',sans-serif;font-size:16.5px;font-weight:600;padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--text-dim);cursor:pointer;transition:border-color .15s,background .15s;}
  .focus-btn:hover{border-color:rgba(62,138,94,.45);color:var(--paper);}
  .focus-btn.correct{border-color:var(--coral);background:rgba(62,138,94,0.2);color:var(--paper);}
  .focus-btn.wrong{border-color:#E67E5B;background:rgba(230,126,91,0.16);animation:shake .3s;}
  .focus-btn.locked{cursor:default;}
  .focus-result{font-size:17px;color:var(--text-faint);margin-top:10px;min-height:16px;}
  .focus-result.good{color:var(--coral);}

  /* DISCUSSION CARD */
  .cuecard{background:linear-gradient(155deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:30px 32px;margin-bottom:24px;}
  .cuecard .label{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--coral);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;}
  .cuecard h3{font-family:'Fraunces',serif;font-size:28px;margin:0 0 14px;line-height:1.3;}
  .cuecard .followup{margin:0;font-size:18.5px;color:var(--text-dim);border-top:1px solid var(--line);padding-top:14px;}
  .cuecard .followup b{color:var(--paper);}
  .notepad{width:100%;min-height:130px;background:var(--ink);border:1px solid var(--line);border-radius:10px;color:var(--paper);font-family:'Inter',sans-serif;font-size:20px;padding:14px;resize:vertical;margin-top:6px;}
  .notepad:focus{outline:none;border-color:var(--coral);}

  /* MODEL ANSWER */
  .ade-key{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .ade-chip{font-family:'JetBrains Mono',monospace;font-size:15.5px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);cursor:pointer;transition:transform .12s;}
  .ade-chip[data-k="O1"]{color:var(--coral);}
  .ade-chip[data-k="R"]{color:var(--gold);}
  .ade-chip[data-k="E"]{color:var(--third);}
  .ade-chip[data-k="O2"]{color:var(--fourth);}
  .ade-chip[data-k="P"]{color:var(--fifth);}
  .ade-chip.active{transform:scale(1.05);border-color:currentColor;}
  .ade-block{padding:16px 18px;border-radius:11px;margin-bottom:10px;border:1px solid var(--line);background:var(--panel);transition:opacity .2s,border-color .2s;line-height:1.65;font-size:19.5px;}
  .ade-block .tag2{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;margin-bottom:8px;display:block;}
  .ade-block.dim{opacity:.3;}
  .ade-block[data-k="O1"] .tag2{color:var(--coral);}
  .ade-block[data-k="R"] .tag2{color:var(--gold);}
  .ade-block[data-k="E"] .tag2{color:var(--third);}
  .ade-block[data-k="O2"] .tag2{color:var(--fourth);}
  .ade-block[data-k="P"] .tag2{color:var(--fifth);}
  .ade-block.highlight[data-k="O1"]{border-color:var(--coral);}
  .ade-block.highlight[data-k="R"]{border-color:var(--gold);}
  .ade-block.highlight[data-k="E"]{border-color:var(--third);}
  .ade-block.highlight[data-k="O2"]{border-color:var(--fourth);}
  .ade-block.highlight[data-k="P"]{border-color:var(--fifth);}

  /* TOOLKIT */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .tool-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;}
  .tool-card h4{margin:0 0 12px;font-size:18.5px;font-family:'Fraunces',serif;font-weight:600;}
  .tool-card .phrase-btn{display:inline-block;font-size:16.5px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:6px 11px;margin:0 6px 6px 0;cursor:pointer;color:var(--text-dim);transition:color .15s,border-color .15s;}
  .tool-card .phrase-btn:hover{color:var(--paper);border-color:var(--gold);}
  .scratch{margin-top:24px;}
  .scratch textarea{width:100%;min-height:90px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--paper);font-family:'Inter',sans-serif;font-size:20px;padding:14px;}
  .scratch textarea:focus{outline:none;border-color:var(--coral);}

  /* PEER SCORE */
  .scorecard{display:flex;flex-direction:column;gap:10px;}
  .score-row{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 16px;}
  .score-row .letter2{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;width:36px;height:36px;border-radius:50%;background:var(--panel-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--coral);}
  .score-row .si-main{flex:1;min-width:0;}
  .score-row .si-title{font-weight:600;font-size:18.5px;}
  .score-row .si-sub{font-size:15.5px;color:var(--text-faint);}
  .pips{display:flex;gap:5px;}
  .pip{width:36px;height:36px;border-radius:7px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;color:var(--text-dim);font-size:17px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;justify-content:center;}
  .pip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);}
  .score-total{margin-top:8px;display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:16px 18px;}
  .score-total .tot-num{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:37px;color:var(--gold);}
  .feedback-fields{display:flex;flex-direction:column;gap:10px;margin-top:18px;}
  .feedback-fields input{background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--paper);padding:11px 14px;font-size:19px;font-family:'Inter',sans-serif;}
  .feedback-fields input:focus{outline:none;border-color:var(--coral);}

  /* EXAM PRACTICE */
  .cue-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:20px;}
  .cue-tab{text-align:center;padding:12px 6px;border-radius:11px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-size:14.5px;font-weight:600;}
  .cue-tab.on{border-color:var(--coral);background:rgba(62,138,94,.2);}
  .cue-tab .emo{font-size:22px;display:block;margin-bottom:4px;}
  .cue-tab .foc{display:block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);margin-top:2px;}
  .assign-note{font-size:17px;color:var(--text-faint);margin:-12px 0 20px;}

  /* WRAP UP */
  .takeaway-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;}

function setupTimer(s){ clearInterval(state.timerInterval); state.timerRunning=false; state.timerTotal=s; state.timerRemaining=s; updateRing(); }
function updateRing(){
  const fg=document.getElementById('ringFg'); const num=document.getElementById('ringNum');
  if(!fg) return;
  fg.style.strokeDashoffset=238.8*(1-state.timerRemaining/state.timerTotal);
  num.textContent=state.timerRemaining;
  if(state.timerRemaining<=6&&state.timerRemaining>0) fg.style.stroke='var(--gold)'; else fg.style.stroke='var(--coral)';
}
function startTimer(){
  if(state.timerRunning) return;
  state.timerRunning=true;
  state.timerInterval=setInterval(()=>{
    state.timerRemaining--;
    updateRing();
    if(state.timerRemaining<=0){ clearInterval(state.timerInterval); state.timerRunning=false; }
  },1000);
}
function timerHTML(seconds, label){
  seconds=seconds||20; label=label||('Thinking time — '+seconds+' seconds');

}

  <div class="warmup-tabs">
    ${warmupQs.map((_,idx)=>`<div class="warmup-tab ${state.warmupTab===idx?'on':''}" data-i="${idx}">${idx+1}</div>`).join('')}

  return `
  <div class="eyebrow">CORE Comprehension · Reading Beyond the Question</div>
  <h2 class="title">What's the Examiner Really Asking?</h2>

  <div class="sort-intro">
    ${qtypeIntro.map(c=>`<div class="sort-intro-item" data-k="${c.k}"><span class="k">${c.k} — ${c.label}</span><p>${c.d}</p></div>`).join('')}

      return `<div class="focus-item">

function renderVocab(){ return `
  <div class="eyebrow">Vocabulary Power-Up · 10–22 min</div>

  </div>`; }

function renderCollocation(){
  const sc=state.matchSolved.size;
  const solvedVerbs=verbs.filter(v=>state.matchSolved.has(v));
  const unsolvedVerbs=verbs.filter(v=>!state.matchSolved.has(v));
  const unsolvedNouns=nouns.filter(n=>!solvedVerbs.some(v=>matchKey[v]===n));
  const verbOrder=solvedVerbs.concat(unsolvedVerbs);
  const nounOrder=solvedVerbs.map(v=>matchKey[v]).concat(unsolvedNouns);
  return `
  <div class="eyebrow">Vocabulary Power-Up · Collocation Match-Up ⚡</div>
  <h2 class="title">Match the Pairs</h2>
  <p class="deck">Click a verb, then click the phrase it goes with. Everything starts jumbled — correct pairs lock in and line up across from each other. ${sc}/${verbs.length} matched so far.</p>
  <div class="match-wrap">
    <div class="match-col"><h4>Verbs</h4>
      ${verbOrder.map((v,i)=>`<div class="match-item ${state.matchSolved.has(v)?'correct locked':''} ${state.matchSel.verb===v?'selected':''}" data-side="verb" data-val="${v}"><span class="tag">${i+1}</span>${v}</div>`).join('')}
    </div>
    <div class="match-col"><h4>Phrases</h4>
      ${nounOrder.map((n,i)=>`<div class="match-item ${solvedVerbs.some(v=>matchKey[v]===n)?'correct locked':''} ${state.matchSel.noun===n?'selected':''}" data-side="noun" data-val="${n}"><span class="tag">${String.fromCharCode(65+i)}</span>${n}</div>`).join('')}
    </div>
  </div>`; }

  const c=examCards[state.cueTab];

/* ===== HANDLERS ===== */
function attachHandlers(){
  const start=document.getElementById('timerStart');
  const reset=document.getElementById('timerReset');
  if(start){
    const initSeconds = 20;
    setupTimer(initSeconds);
    updateRing();
    start.onclick=()=>startTimer();
    reset.onclick=()=>{ setupTimer(initSeconds); };
  }

  document.querySelectorAll('.warmup-tab').forEach(el=>el.addEventListener('click',()=>{ state.warmupTab=+el.dataset.i; markDone('warmup'); renderMain(); startTimer(); }));

  document.querySelectorAll('.focus-btn[data-group="qtype"]').forEach(el=>{
    if(el.classList.contains('locked')) return;
    el.addEventListener('click',()=>{
      const i=+el.dataset.i; const cat=el.dataset.cat;
      if(state.qtypeAnswered[i]) return;
      const correct=cat===qtypeQs[i].cat;
      if(correct){
        state.qtypeAnswered[i]={picked:cat,correct:true}; addScore(1);
        if(Object.keys(state.qtypeAnswered).length===qtypeQs.length) markDone('qtype');
        renderMain();
      } else {
        el.classList.add('wrong');
        setTimeout(()=>el.classList.remove('wrong'),500);
      }
    });
  });

  document.querySelectorAll('.flip').forEach(el=>el.addEventListener('click',()=>{ el.classList.toggle('flipped'); markDone('vocab'); }));

  document.querySelectorAll('#main .match-item').forEach(el=>{
    if(el.classList.contains('locked')) return;
    el.addEventListener('click',()=>{
      const side=el.dataset.side; const val=el.dataset.val;
      state.matchSel[side]=(state.matchSel[side]===val)?null:val;
      if(state.matchSel.verb&&state.matchSel.noun){
        if(matchKey[state.matchSel.verb]===state.matchSel.noun){
          state.matchSolved.add(state.matchSel.verb); addScore(1);
          if(state.matchSolved.size===verbs.length) markDone('collocation');
          state.matchSel={verb:null,noun:null}; renderMain();
        } else {
          renderMain();
          setTimeout(()=>{ document.querySelectorAll('#main .match-item.selected').forEach(x=>x.classList.add('wrong')); setTimeout(()=>{ state.matchSel={verb:null,noun:null}; renderMain(); },500); },30);
        }
      } else renderMain();
    });
  });

  document.querySelectorAll('.idiom').forEach(el=>el.addEventListener('click',()=>{ el.classList.toggle('open'); markDone('idioms'); }));

  document.querySelectorAll('.gap-blank').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=+el.dataset.i;
      state.gapSelected=(state.gapSelected===i)?null:i;
      renderMain();
    });
  });
  document.querySelectorAll('.wb-chip').forEach(chip=>{
    chip.addEventListener('click',()=>{
      if(state.gapSelected===null) return;
      const i=state.gapSelected;
      const word=chip.dataset.word;
      const correctAns=gapfills[i].ans;
      const fb=document.getElementById('gapFeedback');
      if(word===correctAns){
        state.gapFilled[i]=word;
        state.gapSelected=null;
        if(!state.gapScored[i]){ addScore(1); state.gapScored[i]=true; }
        const doneCount=Object.keys(state.gapFilled).length;
        if(doneCount===gapfills.length) markDone('gapfill');
        renderMain();
        setTimeout(()=>{ const f=document.getElementById('gapFeedback'); if(f){ f.textContent=doneCount+' / '+gapfills.length+' correct!'; f.className='quiz-feedback good'; } },10);
      } else {
        if(fb){ fb.textContent='That doesn\'t fit this blank — try another phrase.'; fb.className='quiz-feedback bad'; }
        chip.style.animation='shake .3s'; setTimeout(()=>chip.style.animation='',300);
      }
    });
  });

  document.querySelectorAll('.roundtab button').forEach(b=>b.addEventListener('click',()=>{ state.quizRound=+b.dataset.r; state.quizIdx=0; renderMain(); }));

  document.querySelectorAll('.quiz-opt').forEach(el=>el.addEventListener('click',()=>{
    if(el.classList.contains('locked')) return;
    const key=`${state.quizRound}-${state.quizIdx}`;
    if(state.quizAnswered[key]) return;
    const picked=+el.dataset.i; const q=quizRounds[state.quizRound].qs[state.quizIdx]; const correct=picked===q.ans;
    const totalQs=Object.values(quizRounds).reduce((s,r)=>s+r.qs.length,0);
    if(correct){
      state.quizAnswered[key]={picked,correct:true}; addScore(1);
      if(Object.keys(state.quizAnswered).length===totalQs) markDone('quiz');
      renderMain();
    } else {
      el.classList.add('wrong');
      const fb=document.getElementById('quizFeedbackMsg');
      if(fb){ fb.textContent='✗ Not quite — click another option to try again'; fb.className='quiz-feedback bad'; }
      setTimeout(()=>{
        el.classList.remove('wrong');
        const fb2=document.getElementById('quizFeedbackMsg');
        if(fb2 && !state.quizAnswered[key]){ fb2.textContent='Select an answer'; fb2.className='quiz-feedback'; }
      },700);
    }
  }));

  const qPrev=document.getElementById('quizPrev'); const qNext=document.getElementById('quizNext');
  if(qPrev) qPrev.onclick=()=>{ if(state.quizIdx>0){ state.quizIdx--; renderMain(); } };
  if(qNext) qNext.onclick=()=>{ const r=quizRounds[state.quizRound]; if(state.quizIdx<r.qs.length-1){ state.quizIdx++; renderMain(); } };

  document.querySelectorAll('.focus-btn[data-group="oreo"]').forEach(el=>{
    if(el.classList.contains('locked')) return;
    el.addEventListener('click',()=>{
      const i=+el.dataset.i; const cat=el.dataset.cat;
      if(state.oreoAnswered[i]) return;
      const correct=cat===oreoQs[i].cat;
      if(correct){
        state.oreoAnswered[i]={picked:cat,correct:true}; addScore(1);
        if(Object.keys(state.oreoAnswered).length===oreoQs.length) markDone('oreo');
        renderMain();
      } else {
        el.classList.add('wrong');
        setTimeout(()=>el.classList.remove('wrong'),500);
      }
    });
  });

  document.querySelectorAll('.ade-chip').forEach(el=>el.addEventListener('click',()=>{ const k=el.dataset.k; state.adeActive=(state.adeActive===k)?null:k; markDone('model'); renderMain(); }));

  document.querySelectorAll('.phrase-btn').forEach(el=>el.addEventListener('click',()=>{ const area=document.getElementById('scratchArea'); area.value=(area.value?area.value+' ':'')+el.dataset.phrase+' '; area.focus(); markDone(state.current); }));

  document.querySelectorAll('.pip').forEach(el=>el.addEventListener('click',()=>{ const crit=el.dataset.crit; const n=+el.dataset.n; state.peerScores[crit]=(state.peerScores[crit]===n)?null:n; if(Object.keys(state.peerScores).filter(k=>state.peerScores[k]).length===peerCriteria.length) markDone('peer'); renderMain(); }));

  document.querySelectorAll('.cue-tab').forEach(el=>el.addEventListener('click',()=>{ state.cueTab=+el.dataset.i; markDone('practice'); renderMain(); }));
}

/* ===== INIT ===== */
renderNav();
renderMain();
</script>
