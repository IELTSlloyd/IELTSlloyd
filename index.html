<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS with Lloyd — Login</title>
<style>
  :root {
    --bg: #0f141b;
    --panel: #151c25;
    --line: #263140;
    --ink: #eef2f6;
    --ink-dim: #8fa0b0;
    --navy: #0b2a52;
    --field: #1c2530;
    --error: #e05a5a;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Georgia', 'Cambria', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .login-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 44px 40px 36px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }

  .login-card .big-logo {
    display: block;
    width: 150px;
    margin: 0 auto 28px;
  }

  .login-card h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 28px;
    color: var(--ink);
    font-weight: normal;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--ink-dim);
    margin-bottom: 6px;
    font-family: Arial, sans-serif;
  }

  .field input {
    width: 100%;
    padding: 12px 14px;
    background: var(--field);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    font-size: 15px;
    font-family: Arial, sans-serif;
  }

  .field input::placeholder { color: #5c6c7c; }

  .field input:focus {
    outline: none;
    border-color: #4fb3a9;
  }

  .login-btn {
    width: 100%;
    padding: 13px;
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 15px;
    font-family: Arial, sans-serif;
    cursor: pointer;
    letter-spacing: 0.3px;
    margin-top: 6px;
  }

  .login-btn:hover { background: #123a6e; }
  .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .error-msg {
    display: none;
    background: rgba(224, 90, 90, 0.12);
    border: 1px solid var(--error);
    color: #f3a6a6;
    font-family: Arial, sans-serif;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
  }

  .hint {
    text-align: center;
    color: var(--ink-dim);
    font-size: 12px;
    margin-top: 20px;
    font-family: Arial, sans-serif;
  }
</style>
</head>

  <h1>Log in to continue</h1>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="Enter your email" required>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Login</button>
  </form>

  <p class="hint">Access is restricted. Contact the teacher for credentials.</p>
</div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

  // ---- REPLACE THIS WITH YOUR OWN FIREBASE CONFIG ----
  const firebaseConfig = {
    apiKey: "AIzaSyB1400296LRc1WLrqL404sf4P1M1DGHeEs",
    authDomain: "ielts-with-lloyd.firebaseapp.com",
    projectId: "ielts-with-lloyd",
    storageBucket: "ielts-with-lloyd.firebasestorage.app",
    messagingSenderId: "136226512650",
    appId: "1:136226512650:web:c2c8f159769ec2cc44a4f3"
  };
  // -----------------------------------------------------

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // If already logged in, skip straight to dashboard
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "dashboard.html";
    }
  });

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");
  const loginBtn = document.getElementById("loginBtn");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    signInWithEmailAndPassword(auth, email, password)
      .then(() => {
        window.location.href = "dashboard.html";
      })
      .catch((error) => {
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
        errorMsg.textContent = "Incorrect email or password.";
        errorMsg.style.display = "block";
      });
  });
</script>
